<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>希望解析器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="app">
      <aside class="rail">
        <div class="rail-brand">
          <!-- logo 由 app.js 从 /logo 接口取回后插进来（图在插件根目录 logo.png，
               缩到 128px 传过来）。取不到时留下面的文字兜底，不要写死图片路径。 -->
          <span class="rail-logo" id="rail-logo"><span class="rail-logo-fallback">希</span></span>
          <span class="rail-brand-text">
            <strong>希望解析器</strong>
            <em id="brand-version">—</em>
          </span>
        </div>
        <nav class="rail-nav" id="rail-nav">
          <button class="rail-item is-active" data-view="overview" type="button">
            <span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg></span>
            <span class="rail-label">总览</span>
          </button>
          <button class="rail-item" data-view="parse" type="button">
            <span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>
            <span class="rail-label">解析</span>
          </button>
          <button class="rail-item" data-view="cache" type="button">
            <span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
            <span class="rail-label">缓存</span>
            <span class="rail-badge" id="cache-badge" hidden>0</span>
          </button>
          <button class="rail-item" data-view="appearance" type="button">
            <span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.8"/><circle cx="17.5" cy="10.5" r="0.8"/><circle cx="8.5" cy="7.5" r="0.8"/><circle cx="6.5" cy="12.5" r="0.8"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.2-.3-.3-.4-.7-.4-1.2 0-.9.8-1.7 1.7-1.7h2c3 0 5.4-2.5 5.4-5.5C22 6 17.5 2 12 2z"/></svg></span>
            <span class="rail-label">外观</span>
          </button>
          <button class="rail-item" data-view="config" type="button">
            <span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-.3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8 2.8l.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
            <span class="rail-label">配置</span>
          </button>
        </nav>
        <div class="rail-foot" id="rail-foot">
          <span class="dot" id="rail-dot"></span>
          <span id="rail-status">连接中…</span>
        </div>
      </aside>

      <main class="stage">
        <header class="stage-head">
          <div class="stage-title">
            <h1 id="view-title">总览</h1>
            <p id="view-sub">插件运行状态一览</p>
          </div>
          <div class="stage-actions">
            <span class="pill" id="head-pill" hidden></span>
            <button class="btn" id="btn-reload" type="button">刷新</button>
          </div>
        </header>
        <div class="stage-body" id="stage-body"></div>
      </main>
    </div>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
    <div class="modal-host" id="modal-host" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
