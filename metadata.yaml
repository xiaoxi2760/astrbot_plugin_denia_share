short_desc: 链接分享自动解析，支持 B站|抖音|快手|微博|小红书|Twitter|AcFun|NGA|GitHub|Pixiv
desc: |
  # 达妮娅分享

  自动解析各平台分享链接，渲染为分享卡片发送。

  支持：**B站**（视频/动态/直播/专栏/收藏夹）、**抖音**、**快手**、**微博**（含长文）、
  **小红书**、**Twitter/X**、**AcFun**、**NGA**、**GitHub**（仓库）、**Pixiv**（作品）。

  另有网页截图（`/shot`，thum.io 与 Cloudflare 双后端）与 Pixiv 关键词搜索（`/pixiv`）。

  ## 解析内核

  合并自两个插件，取各自更强的一版：

  - [astrbot_plugin_rika_share](https://github.com/iris1598/astrbot_plugin_rika_share)（MIT）——
    解析架构、卡片渲染、B站 / 微博 / 小红书 / AcFun / NGA
  - astrbot_plugin_media_parser 娅娅版 —— 抖音 a_bogus 签名、快手新版页面兼容、
    Twitter Guest GraphQL 兜底

  抖音采用「HTML 直取 + 签名接口」双路径；Twitter 采用
  「vxtwitter → fxtwitter → 官方 GraphQL」三级兜底。

  B站在 DASH 达不到目标清晰度时回退 html5 单文件 MP4（匿名下可拿 720P，纯 DASH 只有 480P）；
  小红书图片与封面统一改写为无水印原图。

  ## 命令

  - `/shot <网址>` 网页截图
  - `/pixiv <关键词>` Pixiv 搜索（结果强制过滤非全年龄内容）
  - `/bili_login` 扫码登录 B站（管理员）
  - `/bili_check` 检查 B站 Cookie 是否有效
  - `/denia_status` 查看插件运行状态（管理员）
  - `/denia_clear` 清空解析缓存（管理员）

  ## 说明

  本插件**不提供** LLM 文本翻译与「视频仅发送封面」能力。

  Pixiv 模块对非全年龄内容（`xRestrict != 0`）做硬性过滤，不提供开关，
  配置 Cookie 不会放宽该限制。

  建议填写 `GITHUB_TOKEN`：免 token 时 GitHub API 限额 60 次/小时且按出口 IP 计算，
  共享 IP 下极易被限流。
